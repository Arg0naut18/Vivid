<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, in itial-scale=1.0"
        />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *; style-src 'self' 'unsafe-inline' *; img-src 'self' data:; media-src 'self' blob:; connect-src * ws: wss:;"
        />
        <title>Vivid - Video Call</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="bg-gray-900 text-white h-screen flex flex-col">
        <!-- Custom Title Bar (Electron Only) -->
        <div
            id="title-bar"
            class="hidden h-8 bg-gray-900 flex justify-between items-center select-none w-full border-b border-gray-800"
        >
            <div class="drag-region flex-1 h-full flex items-center pl-4 -mt-1">
                <span class="text-xs font-bold text-gray-400">VIVID</span>
            </div>
            <div class="flex h-full">
                <button
                    id="min-btn"
                    class="w-12 h-full hover:bg-gray-700 flex items-center justify-center text-gray-400"
                >
                    <svg width="10" height="1" viewBox="0 0 10 1">
                        <path d="M0 0h10v1H0z" fill="currentColor" />
                    </svg>
                </button>
                <button
                    id="max-btn"
                    class="w-12 h-full hover:bg-gray-700 flex items-center justify-center text-gray-400"
                >
                    <svg width="10" height="10" viewBox="0 0 10 10">
                        <path
                            d="M1 1h8v8H1z"
                            fill="none"
                            stroke="currentColor"
                        />
                    </svg>
                </button>
                <button
                    id="close-btn"
                    class="w-12 h-full hover:bg-red-600 hover:text-white flex items-center justify-center text-gray-400"
                >
                    <svg width="10" height="10" viewBox="0 0 10 10">
                        <path
                            d="M1 1l8 8m0-8l-8 8"
                            stroke="currentColor"
                            stroke-width="1.2"
                        />
                    </svg>
                </button>
            </div>
        </div>

        <header class="p-4 bg-gray-800 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-400">Vivid</h1>
            <div id="room-info" class="hidden">
                Room:
                <span
                    id="room-id-display"
                    class="font-mono bg-gray-700 px-2 py-1 rounded"
                ></span>
            </div>
        </header>

        <main
            class="flex-1 relative flex items-center justify-center overflow-hidden"
        >
            <!-- Join Screen -->
            <div
                id="join-screen"
                class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md mx-4 z-50"
            >
                <h2 class="text-xl mb-4">Join a Session</h2>
                <input
                    type="text"
                    id="user-name"
                    placeholder="Enter Your Name (Optional)"
                    class="w-full p-2 mb-4 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500"
                />
                <input
                    type="text"
                    id="room-id"
                    placeholder="Enter Room ID"
                    class="w-full p-2 mb-4 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500"
                />
                <input
                    type="password"
                    id="room-password"
                    placeholder="Room Password"
                    class="w-full p-2 mb-4 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500"
                />
                <button
                    id="join-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition"
                >
                    Join
                </button>
            </div>

            <!-- Toast Container -->
            <div
                id="toast-container"
                class="absolute top-20 right-5 z-50 flex flex-col space-y-2 pointer-events-none"
            ></div>

            <!-- Video Screen -->
            <div id="video-screen" class="hidden w-full h-full flex flex-col">
                <div id="video-container" class="relative flex-1 bg-black">
                    <!-- Screen Share Placeholder (Visible only when I share screen) -->
                    <div
                        id="screen-share-placeholder"
                        class="hidden flex-col items-center justify-center w-full h-full bg-gray-800 text-gray-400"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            class="w-16 h-16 mb-4 text-blue-400"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                            />
                        </svg>
                        <p class="text-xl font-semibold">
                            You are sharing your screen
                        </p>
                    </div>

                    <!-- Remote Mute Indicator (Main View) -->
                    <div
                        id="main-video-mute-indicator"
                        class="hidden absolute top-4 left-4 bg-red-600 text-white p-2 rounded-full shadow-lg z-10"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
                            />
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M3 3l18 18"
                            />
                        </svg>
                    </div>

                    <!-- Main Video Off Indicator (Placeholder) -->
                    <div
                        id="main-video-off-indicator"
                        class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-gray-500 z-0"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-24 w-24 mb-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1"
                                d="M15 10l4.553-2.276A1 1 0 0121 8.818v6.364a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                            />
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1"
                                d="M3 3l18 18"
                            />
                        </svg>
                        <span class="text-xl">Camera Off</span>
                    </div>

                    <!-- Remote Label (Main View) -->
                    <div
                        id="remote-label-container"
                        class="hidden absolute top-4 left-16 bg-black bg-opacity-50 text-white px-2 py-1 rounded z-10"
                    >
                        <span id="remote-label">Remote</span>
                    </div>

                    <!-- Main Video (Remote or Screen or Local Preview if alone) -->
                    <video
                        id="main-video"
                        autoplay
                        playsinline
                        class="w-full h-full object-contain"
                    ></video>

                    <!-- Local Video Overlay (Draggable) - Initially hidden or minimized? -->
                    <!-- We will manage visibility via JS depending on connection state -->
                    <div
                        id="local-video-container"
                        class="group absolute bottom-4 right-4 w-48 h-36 bg-gray-800 rounded-lg overflow-hidden border-2 border-blue-500 shadow-2xl cursor-move z-20 transition-all duration-300"
                    >
                        <!-- PIP Header (Visible on hover) -->
                        <div
                            class="pip-header absolute top-0 left-0 w-full p-1 z-20 flex justify-end space-x-1 bg-gradient-to-b from-black/70 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"
                        >
                            <button
                                class="minimize-btn text-white hover:text-blue-400 p-1 bg-black/20 rounded"
                                title="Minimize"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="h-4 w-4"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M20 12H4"
                                    />
                                </svg>
                            </button>
                        </div>

                        <!-- Restore Overlay (Visible when minimized) -->
                        <div
                            class="restore-overlay hidden absolute inset-0 z-30 flex flex-col items-center justify-center bg-gray-800 cursor-pointer"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-8 w-8 text-blue-500 mb-1"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
                                />
                            </svg>
                            <span
                                class="text-[10px] text-gray-400 text-center leading-tight"
                                >Click to<br />Restore</span
                            >
                        </div>

                        <!-- Local Video Off Indicator -->
                        <div
                            id="local-video-off-indicator"
                            class="hidden absolute inset-0 flex items-center justify-center bg-gray-900 text-gray-500 z-10"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-10 w-10"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="1.5"
                                    d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"
                                />
                            </svg>
                        </div>

                        <video
                            id="local-video"
                            autoplay
                            playsinline
                            muted
                            class="w-full h-full object-cover mirror"
                        ></video>
                        <div
                            class="absolute bottom-1 left-1 bg-black bg-opacity-50 text-xs px-1 rounded"
                        >
                            <span id="local-label">You</span>
                        </div>

                        <!-- Local Mute Indicator -->
                        <div
                            id="local-mute-indicator"
                            class="hidden absolute top-1 right-1 bg-red-600 text-white p-1 rounded-full shadow"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-3 w-3"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
                                />
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M3 3l18 18"
                                />
                            </svg>
                        </div>
                    </div>

                    <!-- Remote Video Overlay (For when sharing screen) -->
                    <div
                        id="remote-overlay-container"
                        class="group hidden absolute top-4 right-4 w-48 h-36 bg-gray-800 rounded-lg overflow-hidden border-2 border-green-500 shadow-2xl cursor-move z-20 transition-all duration-300"
                    >
                        <!-- PIP Header (Visible on hover) -->
                        <div
                            class="pip-header absolute top-0 left-0 w-full p-1 z-20 flex justify-end space-x-1 bg-gradient-to-b from-black/70 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"
                        >
                            <button
                                class="minimize-btn text-white hover:text-green-400 p-1 bg-black/20 rounded"
                                title="Minimize"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="h-4 w-4"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M20 12H4"
                                    />
                                </svg>
                            </button>
                        </div>

                        <!-- Restore Overlay (Visible when minimized) -->
                        <div
                            class="restore-overlay hidden absolute inset-0 z-30 flex flex-col items-center justify-center bg-gray-800 cursor-pointer"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-8 w-8 text-green-500 mb-1"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
                                />
                            </svg>
                            <span
                                class="text-[10px] text-gray-400 text-center leading-tight"
                                >Click to<br />Restore</span
                            >
                        </div>

                        <!-- Remote Overlay Video Off Indicator -->
                        <div
                            id="remote-overlay-video-off-indicator"
                            class="hidden absolute inset-0 flex items-center justify-center bg-gray-900 text-gray-500 z-10"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-10 w-10"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="1.5"
                                    d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"
                                />
                            </svg>
                        </div>

                        <!-- Remote Overlay Mute Indicator -->
                        <div
                            id="remote-overlay-mute-indicator"
                            class="hidden absolute top-1 right-1 bg-red-600 text-white p-1 rounded-full shadow z-20"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-3 w-3"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
                                />
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M3 3l18 18"
                                />
                            </svg>
                        </div>

                        <video
                            id="remote-video-overlay"
                            autoplay
                            playsinline
                            class="w-full h-full object-cover"
                        ></video>
                        <div
                            class="absolute bottom-1 left-1 bg-black bg-opacity-50 text-xs px-1 rounded"
                        >
                            Remote
                        </div>
                    </div>
                </div>

                <!-- Chat Sidebar (Moved inside Video Screen for Fullscreen support) -->
                <div
                    id="chat-sidebar"
                    class="hidden absolute top-0 right-0 h-full w-80 bg-gray-900 border-l border-gray-700 flex flex-col z-50 shadow-2xl transition-transform duration-300"
                >
                    <!-- ... chat content ... -->
                    <!-- Header -->
                    <div
                        class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800"
                    >
                        <h3 class="font-bold text-lg text-white">Chat</h3>
                        <button
                            id="close-chat"
                            class="text-gray-400 hover:text-white transition"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-6 w-6"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"
                                />
                            </svg>
                        </button>
                    </div>

                    <!-- Messages Area -->
                    <div
                        id="chat-messages"
                        class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-900 scrollbar-thin scrollbar-thumb-gray-600 scrollbar-track-gray-800"
                    >
                        <!-- Messages will appear here -->
                        <div class="text-center text-gray-500 text-sm italic">
                            Session chat started
                        </div>
                    </div>

                    <!-- Input Area -->
                    <div class="p-4 border-t border-gray-700 bg-gray-800">
                        <form id="chat-form" class="flex space-x-2">
                            <input
                                id="chat-input"
                                type="text"
                                placeholder="Type a message..."
                                autocomplete="off"
                                class="flex-1 bg-gray-700 text-white rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 border border-gray-600 placeholder-gray-400"
                            />
                            <button
                                type="submit"
                                id="send-chat-btn"
                                class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-2 transition flex items-center justify-center w-10 h-10"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5 transform rotate-90"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
                                    />
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Fullscreen Hover Trigger (Invisible) -->
                <div
                    id="fullscreen-hover-trigger"
                    class="hidden absolute bottom-0 left-0 w-full h-32 z-40"
                ></div>

                <!-- Controls -->
                <div
                    id="controls-bar"
                    class="bg-gray-800 p-4 flex flex-wrap justify-center items-center gap-4"
                >
                    <button
                        id="toggle-mic"
                        title="Toggle Microphone"
                        class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full font-semibold flex items-center justify-center transition"
                    >
                        <!-- Mic Icon -->
                        <svg
                            id="icon-mic-on"
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
                            />
                        </svg>
                        <!-- Mute Icon (Hidden) -->
                        <svg
                            id="icon-mic-off"
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6 hidden"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
                                clip-rule="evenodd"
                            />
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"
                            />
                        </svg>
                    </button>

                    <button
                        id="toggle-video"
                        title="Toggle Camera"
                        class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full font-semibold flex items-center justify-center transition"
                    >
                        <!-- Video On -->
                        <svg
                            id="icon-video-on"
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M15 10l4.553-2.276A1 1 0 0121 8.818v6.364a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                            />
                        </svg>
                        <!-- Video Off (Hidden) -->
                        <svg
                            id="icon-video-off"
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6 hidden"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"
                            />
                        </svg>
                    </button>

                    <button
                        id="toggle-chat"
                        title="Toggle Chat"
                        class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full font-semibold flex items-center justify-center transition relative"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
                            />
                        </svg>
                        <!-- Unread Badge -->
                        <span
                            id="chat-badge"
                            class="hidden absolute top-0 right-0 block h-3 w-3 transform translate-x-1 -translate-y-1 rounded-full ring-2 ring-gray-800 bg-red-500"
                        ></span>
                    </button>

                    <div class="h-8 w-px bg-gray-600 mx-2"></div>

                    <button
                        id="share-screen"
                        title="Share Screen"
                        class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full font-bold flex items-center justify-center transition"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                            />
                        </svg>
                    </button>

                    <button
                        id="stop-share"
                        title="Stop Sharing"
                        class="hidden bg-red-600 hover:bg-red-700 text-white w-12 h-12 rounded-full font-bold flex items-center justify-center transition"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"
                            />
                        </svg>
                    </button>

                    <div class="h-8 w-px bg-gray-600 mx-2"></div>

                    <!-- Shared Volume Control (Visible when viewing screen share) -->
                    <div
                        id="shared-volume-container"
                        class="relative hidden group"
                    >
                        <!-- Slider Popup (Vertical) -->
                        <div
                            class="absolute bottom-full left-1/2 transform -translate-x-1/2 hidden group-hover:flex flex-col items-center pb-4"
                        >
                            <div
                                class="bg-gray-800 p-3 rounded-lg shadow-xl border border-gray-700"
                            >
                                <input
                                    type="range"
                                    id="shared-volume-slider"
                                    min="0"
                                    max="1"
                                    step="0.05"
                                    value="1"
                                    class="h-24 w-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-blue-500 vertical-slider"
                                    orient="vertical"
                                />
                            </div>
                        </div>

                        <!-- Volume Icon Button -->
                        <button
                            id="shared-volume-btn"
                            title="Shared Audio Volume"
                            class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full font-semibold flex items-center justify-center transition"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-6 w-6"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
                                />
                            </svg>
                        </button>
                    </div>

                    <button
                        id="toggle-fullscreen"
                        title="Toggle Fullscreen"
                        class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full font-bold flex items-center justify-center transition"
                    >
                        <!-- Enter Fullscreen Icon -->
                        <svg
                            id="icon-fullscreen-enter"
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
                            />
                        </svg>
                        <!-- Exit Fullscreen Icon (Hidden) -->
                        <svg
                            id="icon-fullscreen-exit"
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6 hidden"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"
                            />
                            <!-- Better Exit Icon: Arrows pointing in -->
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 14h6m0 0v6m0-6L4 20m16-6h-6m0 0v6m0-6l6 6M4 10h6m0 0V4m0 6L4 4m16 6h-6m0 0V4m0 6l6-6"
                            />
                        </svg>
                    </button>

                    <button
                        id="leave-btn"
                        title="Leave Call"
                        class="bg-red-600 hover:bg-red-700 text-white w-12 h-12 rounded-full font-bold flex items-center justify-center transition"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6 transform rotate-135"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                            />
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Sources Modal (Electron Only) -->
        <div
            id="sources-modal"
            class="hidden fixed inset-0 z-[60] bg-black bg-opacity-80 flex items-center justify-center"
        >
            <div
                class="bg-gray-800 rounded-lg shadow-2xl w-3/4 max-w-4xl max-h-[80vh] flex flex-col"
            >
                <div
                    class="p-4 border-b border-gray-700 flex justify-between items-center"
                >
                    <h2 class="text-xl font-bold">Share Screen</h2>
                    <button
                        id="close-sources-btn"
                        class="text-gray-400 hover:text-white"
                    >
                        <svg
                            class="w-6 h-6"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"
                            ></path>
                        </svg>
                    </button>
                </div>

                <div class="p-4 flex-1 overflow-y-auto">
                    <div
                        id="sources-list"
                        class="grid grid-cols-2 md:grid-cols-3 gap-4"
                    >
                        <!-- Source Items Injected Here -->
                    </div>
                </div>

                <div
                    class="p-4 border-t border-gray-700 flex items-center justify-between bg-gray-900"
                >
                    <div class="flex items-center space-x-4">
                        <label
                            class="flex items-center space-x-2 cursor-pointer"
                        >
                            <input
                                type="checkbox"
                                id="share-audio-check"
                                class="form-checkbox text-blue-600 rounded bg-gray-700 border-gray-600"
                            />
                            <span class="text-sm">Share Audio</span>
                        </label>

                        <div class="flex items-center space-x-2">
                            <span class="text-sm text-gray-400">FPS:</span>
                            <select
                                id="fps-select"
                                class="bg-gray-700 text-white text-sm rounded border border-gray-600 focus:outline-none p-1"
                            >
                                <option value="30">30</option>
                                <option value="60">60</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-xs text-gray-500 italic">
                        Select a source to start sharing
                    </div>
                </div>
            </div>
        </div>

        <script src="logger.js"></script>
        <script src="script.js"></script>
    </body>
</html>
