<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, in itial-scale=1.0">
    <title>Vivid - Video Call</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">
    <header class="p-4 bg-gray-800 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-400">Vivid</h1>
        <div id="room-info" class="hidden">
            Room: <span id="room-id-display" class="font-mono bg-gray-700 px-2 py-1 rounded"></span>
        </div>
    </header>

    <main class="flex-1 relative flex items-center justify-center overflow-hidden">
        <!-- Join Screen -->
        <div id="join-screen" class="bg-gray-800 p-8 rounded-lg shadow-xl w-96">
            <h2 class="text-xl mb-4">Join a Session</h2>
            <input type="text" id="room-id" placeholder="Enter Room ID" class="w-full p-2 mb-4 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
            <input type="password" id="room-password" placeholder="Room Password" class="w-full p-2 mb-4 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
            <button id="join-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">Join</button>
        </div>

        <!-- Video Screen -->
        <div id="video-screen" class="hidden w-full h-full flex flex-col">
            <div id="video-container" class="relative flex-1 bg-black">
                <!-- Screen Share Placeholder (Visible only when I share screen) -->
                <div id="screen-share-placeholder" class="hidden flex-col items-center justify-center w-full h-full bg-gray-800 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-16 h-16 mb-4 text-blue-400">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <p class="text-xl font-semibold">You are sharing your screen</p>
                </div>

                <!-- Remote Mute Indicator -->
                <div id="remote-mute-indicator" class="hidden absolute top-4 left-4 bg-red-600 text-white p-2 rounded-full shadow-lg z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                    </svg>
                </div>

                <!-- Main Video (Remote or Screen) -->
                <video id="remote-video" autoplay playsinline class="w-full h-full object-contain"></video>
                
                <!-- Local Video Overlay (Draggable) -->
                <div id="local-video-container" class="absolute bottom-4 right-4 w-48 h-36 bg-gray-800 rounded-lg overflow-hidden border-2 border-blue-500 shadow-2xl cursor-move z-10">
                    <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover mirror"></video>
                    <div class="absolute bottom-1 left-1 bg-black bg-opacity-50 text-xs px-1 rounded">You</div>
                    
                    <!-- Local Mute Indicator -->
                    <div id="local-mute-indicator" class="hidden absolute top-1 right-1 bg-red-600 text-white p-1 rounded-full shadow">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                        </svg>
                    </div>
                </div>

                <!-- Remote Video Overlay (For when sharing screen) -->
                <div id="remote-overlay-container" class="hidden absolute top-4 right-4 w-48 h-36 bg-gray-800 rounded-lg overflow-hidden border-2 border-green-500 shadow-2xl cursor-move z-20">
                    <video id="remote-video-overlay" autoplay playsinline class="w-full h-full object-cover"></video>
                    <div class="absolute bottom-1 left-1 bg-black bg-opacity-50 text-xs px-1 rounded">Remote</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="bg-gray-800 p-4 flex justify-center items-center space-x-4">
                <button id="toggle-mic" title="Toggle Microphone" class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full font-semibold flex items-center justify-center transition">
                    <!-- Mic Icon -->
                    <svg id="icon-mic-on" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                    <!-- Mute Icon (Hidden) -->
                    <svg id="icon-mic-off" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                    </svg>
                </button>

                <button id="toggle-video" title="Toggle Camera" class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full font-semibold flex items-center justify-center transition">
                    <!-- Video On -->
                    <svg id="icon-video-on" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.818v6.364a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <!-- Video Off (Hidden) -->
                    <svg id="icon-video-off" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                    </svg>
                </button>
                
                <div class="h-8 w-px bg-gray-600 mx-2"></div>

                <button id="share-screen" title="Share Screen" class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full font-bold flex items-center justify-center transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </button>

                <button id="stop-share" title="Stop Sharing" class="hidden bg-red-600 hover:bg-red-700 text-white w-12 h-12 rounded-full font-bold flex items-center justify-center transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                
                <div class="h-8 w-px bg-gray-600 mx-2"></div>

                <button id="leave-btn" title="Leave Call" class="bg-red-600 hover:bg-red-700 text-white w-12 h-12 rounded-full font-bold flex items-center justify-center transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-135" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</bod~
</html>
